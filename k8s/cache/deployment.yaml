apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: dgs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: cache
          image: dgs-cache-node:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 42425
            - containerPort: 42426
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
