apiVersion: v1
kind: ServiceAccount
metadata:
  name: head-server-sa
  namespace: dgs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zone-scaler
  namespace: dgs
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: head-server-zone-scaler
  namespace: dgs
subjects:
  - kind: ServiceAccount
    name: head-server-sa
    namespace: dgs
roleRef:
  kind: Role
  name: zone-scaler
  apiGroup: rbac.authorization.k8s.io
