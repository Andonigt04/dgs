name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    # A REAL MongoDB, because `persistence_e2e` has two halves and they need opposite things: the first
    # needs the database DEAD (it points at a closed port itself) and the second needs it ALIVE, to
    # prove an entity written by one process comes back out of the database in another. Without this
    # service the live half skips, and a skip nobody notices is a test that does not exist — which is
    # why `DGS_REQUIRE_MONGO` below turns the skip into a failure here, where the database is
    # guaranteed to be present.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # ⚠️ `python3` IS NOT DECORATION, and `libmongoc-dev`/`libbson-dev` WERE NOT USED.
          # Running this job in a clean ubuntu:22.04 container is what showed both. mongocxx needs
          # Python to work out its BUILD_VERSION and stopped dead without it ("BUILD_VERSION not
          # specified and could not be calculated"); GitHub's runner image happens to ship Python, so
          # that would have stayed hidden here until the image changed — depending on something the
          # workflow never declares is how a green pipeline turns red for no apparent reason. And
          # mongocxx ignored the apt C driver entirely: "No MongoDB C Driver path provided via
          # CMAKE_PREFIX_PATH, will download C driver version 1.28.0". Two packages installed on
          # every run for nothing.
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential libssl-dev python3 \
            libsasl2-dev pkg-config

      - name: Install mongocxx
        run: |
          # r3.11.0 is the version `persistance_node` and `persistence_e2e` were built and run
          # against locally; CI should compile the same one, not a nearby guess.
          git clone --depth 1 --branch r3.11.0 https://github.com/mongodb/mongo-cxx-driver.git
          cmake -S mongo-cxx-driver -B mongo-cxx-driver/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_SHARED_LIBS=ON \
            -DENABLE_TESTS=OFF \
            -DBUILD_VERSION=3.11.0
          sudo cmake --build mongo-cxx-driver/build --target install -j$(nproc)
          sudo ldconfig

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build nodes
        run: |
          # ⚠️ `social_node` is on this list ON PURPOSE: it was not, and so it went a long time
          # WITHOUT BEING COMPILED and nobody noticed (`PKT_SOCIAL_DELTA`/`PKT_CHAT` unqualified).
          # A target CI does not build rots in silence.
          # The TOOLS are on this list for the same reason `social_node` is: a target CI does not
          # build rots in silence, and `load_zone` / `fill_world` are how every capacity number in the
          # README was produced. A benchmark that no longer compiles is a number nobody can check.
          cmake --build build -j$(nproc) --target \
            head_server_node zone_node social_node \
            validador_node persistance_node dgs_client dgs \
            load_zone fill_world demo_player

      - name: Build tests
        run: |
          cmake --build build -j$(nproc) --target \
            ping_pong_test logger_test thread_pool_test wire_test socket_framing_test auth_e2e_test cli_test tls_test udp_crypto_test robust_test \
            spawn_parity_test validator_e2e_test zone_e2e_test \
            reconnect_e2e_test action_e2e_test ghost_e2e_test \
            social_e2e_test persistence_e2e_test net_degraded_test \
            zone_policy_e2e_test head_routing_e2e_test orchestrator_test client_e2e_test \
            viewer_e2e_test restore_e2e_test handoff_e2e_test social_persist_e2e_test interest_e2e_test \
            world_object_e2e_test client_handoff_e2e_test client_world_e2e_test \
            stub_rules stub_rules_actions

      # ⚠️ NO `|| true`. Three of the four tests used to run as `timeout 5 ... || true`, so their
      # result was thrown away: `ping_pong_test` — the only real round trip against the server —
      # could not fail the build even if it tried. And none of them checked anything: all three did
      # `return 0` regardless. Rewritten to give a verdict, and now that verdict rules. The timeout
      # lives in CTest (60 s), and `ping_pong_test` starts and kills the node itself.
      - name: Generate TLS certificates for the tests
        run: ./tools/tls/make_certs.sh /tmp/dgs-tls

      - name: Run tests
        env:
          # The live half of `persistence_e2e` must RUN here, not skip: the service above provides it.
          DGS_REQUIRE_MONGO: "1"
          MONGO_HOST: "127.0.0.1"
          MONGO_PORT: "27017"
        run: ctest --test-dir build --output-on-failure

  # The same tests, under ThreadSanitizer. It is a separate job rather than part of the main one
  # because TSan shifts the timings enough that a failure here does not mean the same thing as there —
  # and because an instrumented run takes several times longer.
  #
  # Verified before writing this, with a counter-proof: with `stop` written unsynchronised TSan reports
  # `data race ... thread_pool.h:60 in workersLoop()`; with the write under the mutex, clean.
  tsan:
    runs-on: ubuntu-22.04
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev pkg-config

      - name: Configure with ThreadSanitizer
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DDGS_TSAN=ON

      - name: Build
        run: |
          # ⚠️ THIS LIST WAS SHORT BY ELEVEN, and nobody knew because this job has never run. `ctest`
          # executes every test CMake registers, not only the ones a job happened to build, so a test
          # whose binary — or whose NODE — is missing fails with "unable to find executable". It built
          # `head_server_node`, `validador_node` and `stub_rules` and then ran tests that spawn
          # `zone_node`, `social_node` and `dgs`, plus four test executables it never compiled.
          # Cross-checked by parsing `add_test` against this list rather than by reading it.
          #
          # The mongo-dependent targets are absent ON PURPOSE: this job does not install mongocxx, so
          # CMake does not declare them and CTest does not register their tests either.
          cmake --build build-tsan -j$(nproc) --target \
            head_server_node zone_node social_node validador_node dgs stub_rules \
            ping_pong_test logger_test thread_pool_test wire_test socket_framing_test \
            auth_e2e_test cli_test tls_test udp_crypto_test robust_test \
            spawn_parity_test validator_e2e_test zone_e2e_test orchestrator_test \
            reconnect_e2e_test action_e2e_test ghost_e2e_test viewer_e2e_test interest_e2e_test \
            social_e2e_test net_degraded_test \
            zone_policy_e2e_test head_routing_e2e_test handoff_e2e_test \
            world_object_e2e_test client_handoff_e2e_test client_world_e2e_test stub_rules_actions

      - name: Generate TLS certificates for the tests
        run: ./tools/tls/make_certs.sh /tmp/dgs-tls

      - name: Run tests under TSan
        # ⚠️ THE TWO TESTS THAT LINK `DGS::Client` ARE EXCLUDED, and this is a ThreadSanitizer/libstdc++
        # artefact, not a bug in the client — established rather than assumed. The reports were a "double lock of a mutex" in
        # `recvLoop` plus data races on `m_incomingChats`, with TSan printing `mutexes: write M100` on
        # BOTH sides: reader and writer hold the same `m_mtx`, which is not something TSan reports.
        # It reproduces 5 runs out of 5 on gcc 11 (Ubuntu 22.04) and 0 out of 6 on gcc 16, and the
        # mutex TSan names is the one `queryZone` takes around `m_zoneCv.wait_for`.
        #
        # Reduced to 25 lines with no bug in them — a `unique_lock` + `cv.wait_for` on one thread, a
        # `lock_guard` + notify on the other — and gcc 11 still reports the same double lock. The
        # explicit-loop form of `wait_for` reports it too, so it is `wait_for` itself: TSan loses the
        # mutex across its internal unlock/relock and every later access under it looks unsynchronised.
        # `tests/` has nothing to fix here; the exclusion is named, with its reason, which is not the
        # `|| true` this repository used to hide verdicts behind.
        #
        # `client_handoff_e2e` and `client_world_e2e` join it for exactly the same reason and no other:
        # they drive the real `DGS::Client`, so they inherit the same `wait_for`. Verified by running it alone under TSan in
        # the CI container — the two warnings are that same `recvLoop` double lock, and the test itself
        # comes back **8 OK · 0 FAILED**, with the handoff completing (transfers 2, acked 2,
        # promotions 2). It is excluded because of the instrumentation, not because it is unhappy.
        run: ctest --test-dir build-tsan --output-on-failure -E '^client_(e2e|handoff_e2e|world_e2e)$'

  docker-build:
    runs-on: ubuntu-22.04
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.base
          tags: dgs-base:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build service images
        run: |
          docker build -f docker/Dockerfile.head_server      -t dgs-head-server:latest      .
          docker build -f docker/Dockerfile.zone_node        -t dgs-zone-node:latest        .
          docker build -f docker/Dockerfile.validador_node   -t dgs-validador-node:latest   .
          docker build -f docker/Dockerfile.persistence_node -t dgs-persistence-node:latest .
